{%load static%}
<div class="answer-card">
    <div class="author-aside">
        <img src="{{ answer.author.profile.avatar_url }}" alt="Avatar" class="avatar-sm">
        <div class="vote-widget">
            <button class="vote-btn vote-up">▲</button>
            <span class="vote-count">{{answer.rating}}</span>
            <button class="vote-btn vote-down">▼</button>
        </div>
    </div>
    <div class="answer-body">
        <div class="answer-text">
            {{answer.content}}
        </div>
        <div class="answer-footer">
            <div class="answer-controls">
                <label class="correct-checkbox-container">
                    <input type="checkbox" {%if answer.is_correct%}checked{%endif%}>
                    <span class="checkmark"></span>
                    <span class="label-text">Correct?</span>
                </label>
            </div>
            <span class="post-time">{{ answer.created_at|date:"d.m.Y, H:i" }}</span>
        </div>
    </div>
</div>
